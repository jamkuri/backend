services:
  mysql:
    image: mysql:8.4
    container_name: user-registration-mysql
    environment:
      MYSQL_DATABASE: user_registration
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - registration_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  registration_mysql_data:
