<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Registration</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:30px;color:#17202a}
    main{max-width:850px;margin:auto}.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 18px #0001;margin-bottom:24px}
    form{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:600;margin-bottom:6px}
    input,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd2d8;border-radius:7px;font:inherit}
    .wide{grid-column:1/-1}button{background:#1769e0;color:white;border:0;cursor:pointer;font-weight:700}button:hover{background:#1255b7}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb}#message{margin-top:12px}
    @media(max-width:600px){form{grid-template-columns:1fr}.wide{grid-column:auto}table{font-size:13px}}
  </style>
</head>
<body><main>
  <section class="card">
    <h1>Register User</h1>
    <form id="userForm">
      <div><label for="firstName">First name</label><input id="firstName" required></div>
      <div><label for="lastName">Last name</label><input id="lastName" required></div>
      <div class="wide"><label for="fatherName">Father name</label><input id="fatherName" required></div>
      <div class="wide"><label for="address">Address</label><textarea id="address" required></textarea></div>
      <button class="wide" type="submit">Save User</button>
    </form>
    <div id="message"></div>
  </section>
  <section class="card">
    <h2>All Users</h2>
    <table><thead><tr><th>ID</th><th>Name</th><th>Father</th><th>Address</th></tr></thead><tbody id="users"></tbody></table>
  </section>
</main>
<script>
  const form = document.getElementById('userForm');
  const message = document.getElementById('message');

  async function loadUsers() {
    const response = await fetch('/api/users');
    const users = await response.json();
    document.getElementById('users').innerHTML = users.map(user => `
      <tr><td>${user.id}</td><td>${escapeHtml(user.firstName)} ${escapeHtml(user.lastName)}</td>
      <td>${escapeHtml(user.fatherName)}</td><td>${escapeHtml(user.address)}</td></tr>`).join('');
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const body = {
      firstName: document.getElementById('firstName').value.trim(),
      lastName: document.getElementById('lastName').value.trim(),
      fatherName: document.getElementById('fatherName').value.trim(),
      address: document.getElementById('address').value.trim()
    };
    const response = await fetch('/api/users', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
    });
    if (response.ok) {
      message.textContent = 'User saved successfully.';
      message.style.color = 'green'; form.reset(); await loadUsers();
    } else {
      message.textContent = 'Please complete all fields.'; message.style.color = 'crimson';
    }
  });
  loadUsers();
</script></body></html>
